name: Inspect Stremio binary

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect
        run: |
          set -uo pipefail
          rm -rf work out
          mkdir -p work out
          unzip -q input/Stremio.ipa -d work
          APP="work/Payload/Stremio.app"
          BIN="$APP/Stremio"
          ls -l "$APP" > out/00_app_listing.txt
          ls -l "$APP/Frameworks" >> out/00_app_listing.txt 2>&1 || true
          cp "$APP/Info.plist" out/01_Info.plist

          # 1) ObjC methods/classes related to playing, external players, streams
          otool -oV "$BIN" 2>/dev/null \
            | grep -i -E "name .*(play|stream|external|openurl|player|context|menu)" \
            | sed 's/^ *//' | sort -u > out/10_objc_methods.txt || true
          otool -oV "$BIN" 2>/dev/null | grep -E "^ +name 0x[0-9a-f]+ .*" \
            | grep -i -E "Stremio" | sed 's/^ *//' | sort -u > out/11_objc_stremio_names.txt || true

          # 2) Swift symbols (demangled)
          nm "$BIN" 2>/dev/null | xcrun swift-demangle 2>/dev/null \
            | grep -i -E "external|openURL|playStream|playerType|openIn|contextMenu|PlayerSetting|StreamRow|StreamItem" \
            | sort -u | head -3000 > out/20_swift_symbols.txt || true

          # 3) Strings related to the external player setting / URL schemes / defaults keys
          strings -a "$BIN" \
            | grep -i -E "external|outplayer|infuse|installedplayer|playerType|player_type|defaultPlayer|Dahili|Harici|openURL|playInExternal|in built-in" \
            | sort -u | head -3000 > out/30_strings.txt || true

          # 4) Same search in every framework binary and bundle resource
          grep -rIl -i -E "external.?player|playerType|player_type" "$APP" 2>/dev/null | head -100 > out/40_text_files_hit.txt || true
          grep -rao -i -E "[A-Za-z_.]{0,30}(xternal.?[Pp]layer|player.?[Tt]ype)[A-Za-z_.]{0,30}" "$APP" 2>/dev/null \
            | sort | uniq -c | sort -rn | head -300 > out/41_binary_hits.txt || true

          # 5) Localization entries for the menu text
          grep -rl "Harici" "$APP" 2>/dev/null | head -20 > out/50_strings_files.txt || true
          for f in $(find "$APP" -name "Localizable*.strings" | head -20); do
            plutil -convert xml1 -o - "$f" 2>/dev/null | grep -i -B1 -A1 -E "external|harici|dahili" >> out/51_localized_entries.txt || true
          done

          ls -lh out

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: stremio-inspect
          path: out
          if-no-files-found: error
