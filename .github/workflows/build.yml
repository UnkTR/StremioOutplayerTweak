name: Build Stremio Outplayer Tweak

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build dylib
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -miphoneos-version-min=13.0 \
            -isysroot "$SDK" \
            -fobjc-arc \
            -dynamiclib \
            -install_name @executable_path/Frameworks/StremioOutplayerTweak.dylib \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            -framework QuartzCore \
            -framework MediaPlayer \
            -framework CoreText \
            -o StremioOutplayerTweak.dylib \
            Tweak.m
          codesign -f -s - StremioOutplayerTweak.dylib
          file StremioOutplayerTweak.dylib
          otool -L StremioOutplayerTweak.dylib

      - name: Embed tweak into IPA
        run: |
          set -euo pipefail
          rm -rf work
          mkdir -p work
          unzip -q input/Stremio.ipa -d work
          APP="work/Payload/Stremio.app"
          test -f "$APP/Stremio"
          cp StremioOutplayerTweak.dylib "$APP/Frameworks/StremioOutplayerTweak.dylib"
          codesign -f -s - "$APP/Frameworks/StremioOutplayerTweak.dylib"
          if [ -d fonts ]; then
            mkdir -p "$APP/OPFonts"
            cp fonts/*.otf "$APP/OPFonts/"
            ls -l "$APP/OPFonts"
          fi
          python3 -m venv venv
          source venv/bin/activate
          pip install --quiet lief
          python embed_tweak.py "$APP/Stremio" "@executable_path/Frameworks/StremioOutplayerTweak.dylib"
          otool -L "$APP/Stremio" | grep StremioOutplayerTweak
          rm -rf "$APP/_CodeSignature"

      - name: Package IPA
        run: |
          set -euo pipefail
          cd work
          zip -qry ../StremioOutplayerTweaked.ipa Payload
          cd ..
          ls -lh StremioOutplayerTweaked.ipa

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StremioOutplayer
          path: |
            StremioOutplayerTweak.dylib
            StremioOutplayerTweaked.ipa
          if-no-files-found: error
